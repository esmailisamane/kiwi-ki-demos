[project]
name = "kiwi-laden-mcp"
version = "0.1.0"
description = "Ausgedachter Online-Laden als MCP-Server mit FastMCP 4 - Lern-Demo aus dem KIwi-Video"
requires-python = ">=3.11"
dependencies = ["fastmcp==4.1.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
